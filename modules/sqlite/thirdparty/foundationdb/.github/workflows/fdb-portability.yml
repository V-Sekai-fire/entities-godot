# Build and package FoundationDB on Windows and macOS, with Linux as the control.
#
# 7.3.76 ships deb, rpm and .so and nothing else, so neither Windows nor macOS has an
# upstream binary. One job per platform, and the targets chain in a single build tree:
# fdb_c -> fdbcli -> fdbserver -> package. fdbserver is the one that decides; a green
# fdb_c and fdbcli with a red fdbserver is a client-only port.
#
# Linux builds in the official foundationdb/build image. Windows needs a Visual Studio
# generator, because CMake enables the CSharp language nowhere else and FDB's actor
# compiler is a C# program, plus -T ClangCL, because flow uses GNU __attribute__ syntax
# and has never compiled under cl.exe. macOS needs almost no flags: cmake/ already knows
# the APPLE defaults.
#
# Packaging is FoundationDB's own where FoundationDB has one - WiX from packaging/msi/ on
# Windows, packaging/osx/buildpkg.sh on macOS. Linux uses fpm, because the in-tree deb and
# rpm rules run through CPack as part of `packages`, which builds far more than the control
# needs.
name: fdb portability

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: publish the built binaries to this release tag (blank publishes nothing)
        required: false
        default: ""
      only:
        description: build only the matrix entry with this name, such as windows-flowquic (blank builds all)
        required: false
        default: ""
  push:
    branches: [portability-consensus]
  # A pull request into the branch this workflow guards runs it too. Without this a change
  # to the workflow could not be tested by the workflow: the fix for the exit 127 that
  # killed run 31594247582 sat as a draft reporting "no checks", because nothing triggered
  # on a pull request and there was therefore nothing for it to pass. A change to CI is the
  # change that most needs CI.
  #
  # Scoped to that one base branch rather than every pull request, because this is three
  # platforms building FoundationDB from source and the cost is real.
  pull_request:
    branches: [portability-consensus, main]
  # The merge queue builds the PR merged onto the queue's base in a merge_group run.
  merge_group:

permissions:
  contents: write

concurrency:
  group: fdb-portability-${{ github.ref }}-${{ inputs.only || 'all' }}
  # A manual re-dispatch on the same ref and `only` used to queue behind a stale run instead of
  # replacing it (e.g. after a transient msgpack download failure), since only pull_request
  # cancelled. workflow_dispatch now does too, for the same reason: a dev iterating on one branch
  # wants their next dispatch to win, not wait. push and merge_group stay serialized.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  # A job-level `if` cannot see the matrix, so the matrix is built here and `only` filters it.
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
    steps:
      - uses: actions/checkout@v5
      # The matrix and its filter live in a file so a desk can test them (test_plan_matrix.py).
      - id: m
        env:
          ONLY: ${{ inputs.only }}
        run: python3 .github/scripts/plan_matrix.py

  build:
    needs: plan
    name: ${{ matrix.label || matrix.os }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

    steps:
      # This fork, not apple/foundationdb: the port carries source fixes that cannot be made
      # from a CI file. It is origin/release-7.3 plus commits reviewable as a diff against it.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        if: matrix.os == 'windows'
        with: { python-version: "3.12" }

      # ProtocolVersion.h is generated by protocol_version.py, which imports Jinja2.
      - name: Jinja2 for ProtocolVersion.h codegen
        if: matrix.os == 'windows'
        run: pip install "Jinja2==3.1.6" "MarkupSafe==2.1.3"

      # The macOS tools come from .github/macos/pixi.toml, locked, not Homebrew: cmake, ninja,
      # Python with Jinja2 (ProtocolVersion.h codegen), a static OpenSSL built for macOS 11 so
      # it does not raise libfdb_c above its deployment target, and mono for the actor
      # compiler's mcs (osx-64 only on conda-forge, so it runs under Rosetta and ships nothing).
      #
      # Deliberately not installed: boost (CompileBoost.cmake asks 1.78.0 EXACT and builds its
      # own), fmt (contrib asks 8.1.1 EXACT and falls back to contrib/fmt-8.1.1), lz4 (RocksDB
      # only), jemalloc (ConfigureCompiler.cmake:39 defaults it off for APPLE).
      - name: Rosetta, for the osx-64 mono
        if: matrix.os == 'macos'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || arch -x86_64 /usr/bin/true

      - name: Dependencies (macos)
        if: matrix.os == 'macos'
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          manifest-path: .github/macos/pixi.toml
          environments: default mono
          locked: true
          cache: true

      - name: Put the macOS tools on PATH
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          envs="$GITHUB_WORKSPACE/.github/macos/.pixi/envs"
          echo "$envs/default/bin" >> "$GITHUB_PATH"
          echo "$envs/mono/bin" >> "$GITHUB_PATH"
          echo "FDB_TOOLS_PREFIX=$envs/default" >> "$GITHUB_ENV"
          arch -x86_64 "$envs/mono/bin/mono" --version | head -1

      # picotls does FIND_PACKAGE(PkgConfig REQUIRED) unconditionally (CMakeLists.txt:12) and
      # the runner has no pkg-config. The brotli lookups after it are optional.
      - name: pkg-config (windows, flowquic)
        if: matrix.flowquic == 'ON'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            choco install pkgconfiglite -y --no-progress && break
            echo "::warning::choco attempt $attempt failed; retrying"
          done
          exe="C:/ProgramData/chocolatey/bin/pkg-config.exe"
          [ -f "$exe" ] || { echo "::error::$exe is missing after the install"; exit 1; }
          "$exe" --version
          echo "PKG_CONFIG_EXECUTABLE=$exe" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries (windows)
        if: matrix.os == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-windows-static-lz4-fmt-zlib-openssl-v4

      # zlib and openssl are find_package(... REQUIRED) at FDBComponents.cmake:36-37 with no
      # guard; -DWITH_TLS=OFF is read later in the same file and does not reach them. The
      # -static triplet is required by ConfigureCompiler.cmake:120, which sets /MT.
      - name: Dependencies (windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            vcpkg install lz4:x64-windows-static fmt:x64-windows-static \
                          zlib:x64-windows-static openssl:x64-windows-static && exit 0
            echo "::warning::vcpkg attempt $attempt failed; retrying"
          done
          exit 1

      # CompileBoost.cmake builds Boost everywhere except WIN32, where it either finds one or
      # calls FATAL_ERROR, so Windows has to be handed one. The version is bounded on both
      # sides: FDB asks for 1.78 or newer, and flow/IThreadPool.cpp uses boost::asio::io_service,
      # which Boost removed in 1.87 - so vcpkg's 1.91 cannot work.
      #
      # Prebuilt rather than compiled: every Boost old enough to keep io_service ships a b2 too
      # old to detect MSVC 14.51, and bootstrap fails with "Failed to build Boost.Build engine".
      # These are vc143 binaries and clang-cl targets the same ABI. 1.86 also ships
      # BoostConfig.cmake, which CMake 4.4 requires now that FindBoost is gone.
      - name: Cache Boost (windows)
        if: matrix.os == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/boost
          key: boost-1.86.0-msvc-14.3-x64-v1

      - name: Boost 1.86 (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $prefix = "$env:GITHUB_WORKSPACE\boost"
          if (Test-Path "$prefix\boost\version.hpp") { "boost already cached at $prefix"; exit 0 }
          $url = "https://archives.boost.io/release/1.86.0/binaries/boost_1_86_0-msvc-14.3-64.exe"
          Invoke-WebRequest -Uri $url -OutFile boost-installer.exe
          # Inno Setup; /SP- suppresses the prompt /VERYSILENT alone leaves in place.
          Start-Process -Wait -FilePath .\boost-installer.exe `
            -ArgumentList '/VERYSILENT','/SP-','/SUPPRESSMSGBOXES',"/DIR=$prefix"
          if (-not (Test-Path "$prefix\boost\version.hpp")) { throw "boost headers missing" }
          if (-not (Test-Path "$prefix\lib64-msvc-14.3\cmake\Boost-1.86.0\BoostConfig.cmake")) {
            throw "BoostConfig.cmake missing; config mode would fail"
          }
          Get-ChildItem "$prefix" | Select-Object -First 10 Name

      # So an exit 137 is read as an OOM kill rather than guessed at.
      - name: Machine
        if: matrix.os != 'windows'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = macos ]; then
            sysctl -n hw.ncpu hw.memsize
          else
            nproc
            free -m
          fi
          df -h .

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          # Deterministic package names without FDB_RELEASE.
          #
          # FDB_RELEASE=ON was set to drop the build timestamp so two runs of the same commit
          # name their packages the same (CMakeLists.txt:96). It also does something the
          # comment never said: ConfigureCompiler.cmake:181 reads it as "generate full debug
          # symbols" and emits -ggdb instead of -ggdb1, and :191 then refuses to compress
          # them because CPack cannot build a debuginfo package from compressed sections. So
          # a naming convenience bought the largest debug info clang can emit, uncompressed,
          # on the actor-generated translation units -- which are the ones that killed the
          # linux job at [328/595].
          #
          # CMakeLists.txt:100 already offers the honest way to get the same names:
          # FDB_BUILDTIME is a cache variable "required to achieve uniform naming across
          # different builds". Pinned to the commit's own date, two runs of one commit agree
          # and two different commits do not, which is what was wanted. -ggdb1 and -gz come
          # back with it.
          #
          # The checkout is owned by a different uid than the container runs as, so git
          # refuses it as "dubious ownership". This step runs under bash -e, so that refusal
          # ended the step before cmake was reached, which is why the first attempt failed in
          # seconds with no configure output at all. Marking it safe is the documented fix,
          # and the value is checked rather than assumed: a package named after an empty
          # timestamp is worse than one named after a real clock.
          git config --global --add safe.directory "$PWD" || true
          STAMP=$(git show -s --format=%cd --date=format:%Y%m%d%H%M%S HEAD 2>/dev/null || true)
          if [ -z "$STAMP" ]; then
            echo "::error::cannot read the commit date, so package names would not be reproducible"
            exit 1
          fi
          echo "package timestamp pinned to the commit: $STAMP"
          COMMON="-DCMAKE_EXPORT_COMPILE_COMMANDS=ON
                  -DBUILD_TESTING=OFF -DBUILD_DOCUMENTATION=OFF -DWITH_SWIFT=OFF
                  -DWITH_JAVA_BINDING=OFF -DWITH_GO_BINDING=OFF -DWITH_RUBY_BINDING=OFF
                  -DFDB_BUILDTIME=$STAMP"
          QUIC_ARGS=""
          if [ "${{ matrix.flowquic }}" = ON ]; then
            QUIC_ARGS="-DFLOWQUIC=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DPKG_CONFIG_EXECUTABLE=$PKG_CONFIG_EXECUTABLE"
          fi
          if [ "${{ matrix.os }}" = windows ]; then
            # No -G: CMake's default is the newest installed Visual Studio, and this runner
            # ships VS 18, so naming "Visual Studio 17 2022" named one that is not there.
            #
            # -DBoost_COMPILER=vc143 is load-bearing. BoostDetectToolset reads Clang with
            # MSVC_VERSION set, concludes clangw22, and every vc143 component skips itself;
            # configure then dies at CompileBoost.cmake:156 on a missing Boost::filesystem,
            # two steps downstream of the cause. Boost_USE_STATIC_RUNTIME picks -mt-s-x64,
            # matching the /MT that ConfigureCompiler.cmake:120 sets and lld-link enforces.
            cmake -S . -B build $COMMON -A x64 -T ClangCL \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DBOOST_ROOT="${{ github.workspace }}/boost" \
              -DBOOST_LIBRARYDIR="${{ github.workspace }}/boost/lib64-msvc-14.3" \
              -DBoost_DIR="${{ github.workspace }}/boost/lib64-msvc-14.3/cmake/Boost-1.86.0" \
              -DBoost_COMPILER=vc143 -DBoost_USE_STATIC_LIBS=ON \
              -DBoost_USE_STATIC_RUNTIME=ON \
              -DVCPKG_TARGET_TRIPLET=x64-windows-static \
              -DWITH_TLS=OFF -DUSE_JEMALLOC=OFF -DSSD_ROCKSDB_EXPERIMENTAL=OFF $QUIC_ARGS 2>&1 | tee configure.log
            grep -E 'CMAKE_GENERATOR:|Boost' build/CMakeCache.txt | head -10 || true
          elif [ "${{ matrix.os }}" = macos ]; then
            # Only what cmake/ cannot work out: the pixi OpenSSL prefix, RocksDB off to match
            # the other two, and macOS 13 as the deployment target, which the double engine
            # targets; without it the dylib takes the runner's own macOS as its minimum.
            # CompileBoost.cmake passes the same target to b2. TLS stays on, as on Linux.
            # Boost is not installed, so FDB compiles its own 1.78 - the supported macOS path,
            # and the slowest step in this job.
            cmake -S . -B build $COMMON -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DSSD_ROCKSDB_EXPERIMENTAL=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
              -DOPENSSL_ROOT_DIR="$FDB_TOOLS_PREFIX" \
              -DPython3_EXECUTABLE="$FDB_TOOLS_PREFIX/bin/python" 2>&1 | tee configure.log
          else
            # RocksDB off, as on the other two: it is 340 targets before fdbserver starts, and
            # a control configured unlike what it controls answers a different question. LLD
            # because a BFD link of fdbserver runs the runner out of memory.
            cmake -S . -B build $COMMON -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DSSD_ROCKSDB_EXPERIMENTAL=OFF -DUSE_LD=LLD 2>&1 | tee configure.log
          fi

      # The debug-symbol claim above, checked rather than argued. -ggdb on the actor files
      # is what ran the runner out of memory, so if a future flag turns it back on this is
      # where it should be caught -- not by a third exit 137 forty minutes into a build.
      - name: Minimal debug symbols, and compressed
        if: matrix.os == 'linux'
        shell: bash
        run: |
          # ConfigureCompiler.cmake picks -g1 (minimal), -g2 (Debug) or -g3 (FULL_DEBUG_SYMBOLS). The earlier spelling,
          # -ggdb1, no longer appears; grep then found nothing and, under pipefail, ended the step before it printed.
          flags=$(grep -o -E -- '-g[0-9]\b' build/compile_commands.json | sort -u | tr '\n' ' ' || true)
          gz=$(grep -c -- '-gz' build/compile_commands.json || true)
          echo "debug flags in use: ${flags:-none}   -gz occurrences: $gz"
          case "$flags" in
            *"-g3"*|*"-g2"*)
              echo "::error::more than minimal debug symbols are on (-g2 or -g3); ConfigureCompiler.cmake FULL_DEBUG_SYMBOLS or a Debug build type was reached"
              exit 1 ;;
            *"-g1"*) ;;
            *)
              echo "::error::no -g1 in the compile commands, so the minimal-symbols setting was not applied"
              exit 1 ;;
          esac
          [ "$gz" -gt 0 ] || { echo "::error::debug sections are not compressed; COMPRESS_DEBUG_SYMBOLS was off"; exit 1; }
          echo "minimal symbols, compressed"

      # Each step stops the job, so a failure names the first thing that broke. --config Release
      # is what the Visual Studio generator needs and what Ninja ignores.
      - name: Build fdb_c
        if: matrix.flowquic != 'ON'
        shell: bash
        run: |
          set +e
          cmake --build build --config Release --target fdb_c --parallel ${{ matrix.build_jobs }} 2>&1 | tee build-fdb_c.log
          rc=${PIPESTATUS[0]}
          grep -iE "error|fatal|Could NOT find|cannot open" build-fdb_c.log | head -60
          exit $rc

      - name: Build fdbcli
        if: matrix.flowquic != 'ON'
        shell: bash
        run: |
          set +e
          cmake --build build --config Release --target fdbcli --parallel ${{ matrix.build_jobs }} 2>&1 | tee build-fdbcli.log
          rc=${PIPESTATUS[0]}
          grep -iE "error|fatal|Could NOT find|cannot open" build-fdbcli.log | head -60
          exit $rc

      # The one that decides; everything above is a client. Parallelism is bounded here and
      # nowhere else: fdbserver's actor-generated translation units are large enough that an
      # unqualified --parallel got the job killed at exit 137.
      - name: Build fdbserver
        if: matrix.flowquic != 'ON'
        shell: bash
        run: |
          set +e
          # GNU time takes -v, BSD time takes -l, and Windows has neither. Probe for the
          # binary rather than inferring it from the OS: the linux job runs inside
          # foundationdb/build:rockylinux9-latest, which does not ship GNU time (it is a
          # separate RPM), so assuming the platform implied the tool failed the build at
          # exit 127 before cmake was ever reached. macOS carries it in the base system,
          # which is why only linux broke and the failure looked like a compiler error.
          #
          # The measurement earns its keep (see the exit 137 note above), so install it
          # when a package manager is present and fall back to an unmeasured build when
          # it is not. Losing the peak-RSS line must not cost us the build.
          TIME=""
          if [ ! -x /usr/bin/time ] && [ "${{ matrix.os }}" = linux ] && command -v dnf >/dev/null 2>&1; then
            dnf install -y time >/dev/null 2>&1 || true
          fi
          if [ -x /usr/bin/time ]; then
            [ "${{ matrix.os }}" = linux ] && TIME="/usr/bin/time -v"
            [ "${{ matrix.os }}" = macos ] && TIME="/usr/bin/time -l"
          else
            echo "note: /usr/bin/time absent; building without peak-RSS measurement"
          fi
          $TIME cmake --build build --config Release --target fdbserver \
            --parallel ${{ matrix.build_jobs }} 2>&1 | tee build-fdbserver.log
          rc=${PIPESTATUS[0]}
          grep -iE "error|fatal|Could NOT find|cannot open" build-fdbserver.log | head -60
          grep -iE "maximum resident set size" build-fdbserver.log || true
          exit $rc

      - name: Package (fpm, linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -eu
          command -v gem >/dev/null && gem install --no-document fpm || {
            echo "::warning::no ruby; cannot run fpm"; exit 0; }
          mkdir -p stage/usr/bin stage/usr/lib
          cp build/bin/fdbserver build/bin/fdbcli stage/usr/bin/ 2>/dev/null || true
          cp build/lib/libfdb_c.* stage/usr/lib/ 2>/dev/null || true
          # From CMakeLists.txt, not typed here: a hardcoded version drifts on every rebase.
          V=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\) *$/\1/p' CMakeLists.txt | head -1)
          [ -n "$V" ] || { echo "::error::no VERSION in CMakeLists.txt"; exit 1; }
          for t in deb rpm; do
            fpm -s dir -t "$t" -n foundationdb-portability -v "$V" \
              --description "FoundationDB $V built from source for linux" \
              -C stage . || echo "::warning::fpm $t failed"
          done
          ls -l *.deb *.rpm 2>/dev/null || true

      # FDB's own packaging, unbuilt by any CI until now. buildpkg.sh reads build/version.txt,
      # bin/{fdbcli,fdbbackup,fdbserver,fdbmonitor}, lib/libfdb_c.dylib, the generated headers
      # and bindings/python/fdb/*.py, so the three targets the chain above has not built are
      # built first. No `|| true`: a package that silently is not produced is what this checks.
      - name: Package (pkgbuild, macos)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set +e
          cmake --build build --config Release \
            --target fdbbackup fdbmonitor python_binding --parallel ${{ matrix.build_jobs }} 2>&1 | tee build-pkgdeps.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -iE "error|fatal|Could NOT find" build-pkgdeps.log | head -30; exit $rc
          fi
          mkdir -p build/packages
          ./packaging/osx/buildpkg.sh build . 2>&1 | tee pkg.log
          rc=${PIPESTATUS[0]}
          find build/packages -name '*.pkg' -print
          [ "$rc" -eq 0 ] && [ -z "$(find build/packages -name '*.pkg' -print -quit)" ] && {
            echo "::error::buildpkg.sh succeeded but produced no .pkg"; rc=1; }
          exit $rc

      # The target is `installer`; there is no target named MSI anywhere in the tree
      # (packaging/msi/CMakeLists.txt:53). FindWIX.cmake resolves candle and light through
      # $ENV{WIX}, so that is what is probed. `installer` also pulls in fdbmonitor, fdbbackup
      # and python_binding. No `|| true`, for the same reason as macOS above.
      - name: Package (MSI, windows)
        if: matrix.os == 'windows' && matrix.flowquic != 'ON'
        shell: bash
        run: |
          set +e
          [ -n "$WIX" ] || echo "::warning::WIX env var unset; FindWIX resolves candle/light through it"
          cmake --build build --config Release --target installer --parallel 2>&1 | tee msi.log
          rc=${PIPESTATUS[0]}
          grep -iE "error|fatal|WIX|No rule to make target" msi.log | head -30
          find build -name '*.msi' -print
          [ "$rc" -eq 0 ] && [ -z "$(find build -name '*.msi' -print -quit)" ] && {
            echo "::error::installer target succeeded but produced no .msi"; rc=1; }
          exit $rc

      # A -D that nothing reads is accepted silently, so check the option took effect and
      # say which OpenSSL and picotls were found, before the long build.
      - name: FLOWQUIC took effect, and which OpenSSL
        if: matrix.flowquic == 'ON'
        shell: bash
        run: |
          cmake --version | head -1
          grep -E '^(FLOWQUIC|PKG_CONFIG_EXECUTABLE|OPENSSL_[A-Z_]*|FLOWQUIC_PICOQUIC_TAG|PICOQUIC_FETCH_PTLS|WITH_OPENSSL)[:=]' build/CMakeCache.txt || true
          grep -q '^FLOWQUIC:BOOL=ON' build/CMakeCache.txt || { echo "::error::FLOWQUIC is not ON in the cache"; exit 1; }
          grep -q '^OPENSSL_INCLUDE_DIR:PATH=.*vcpkg' build/CMakeCache.txt || { echo "::error::OpenSSL headers did not come from vcpkg"; exit 1; }
          grep -E 'Found OpenSSL' configure.log

      # One command per target, none stopping the next, so one run says which of picotls, picoquic
      # and the driver compile and not only the first that breaks. The step still fails if any did.
      - name: Build flow_quic_echo, and the libraries under it
        if: matrix.flowquic == 'ON'
        shell: bash
        run: |
          set +e
          rc=0
          for t in picotls-core picotls-minicrypto picotls-openssl picoquic-core picohttp-core flowquic_unit_tests ptls_cifra_ctz_probe flow_quic_echo; do
            cmake --build build --config Release --target $t --parallel ${{ matrix.build_jobs }} > "build-$t.log" 2>&1
            r=$?
            echo "target $t: exit $r"
            grep -E "error|fatal|LNK[0-9]+|unresolved" "build-$t.log" | head -20
            [ $r -eq 0 ] || rc=1
          done
          exit $rc

      # Unit tests of the run judge. Pure decision-table checks, so they gate the echo run.
      - name: Unit tests (flowquic)
        if: matrix.flowquic == 'ON'
        shell: bash
        run: |
          exe=$(find build -name flowquic_unit_tests.exe | head -1)
          [ -n "$exe" ] || { echo "::error::flowquic_unit_tests.exe was not built"; exit 1; }
          "$exe" 2>&1 | tee unit-tests.log

      # A probe, not a gate: cifra's count_trailing_zeroes on Windows reads as a leading-zero count.
      # The numbers go in the log; the step cannot fail the job.
      - name: cifra count_trailing_zeroes probe
        if: matrix.flowquic == 'ON'
        continue-on-error: true
        shell: bash
        run: |
          exe=$(find build -name ptls_cifra_ctz_probe.exe | head -1)
          [ -n "$exe" ] || { echo "::error::ptls_cifra_ctz_probe.exe was not built"; exit 1; }
          "$exe" 2>&1 | tee cifra-probe.log

      # The echo run, on this entry only. Operator exception to the CPU integration-test
      # blocklist for this one job, 2026-11-07 (like gate-mm). Five cases, three runs each:
      # QUIC positive and control, WebTransport positive, control and bad path.
      - name: Run flow_quic_echo
        if: matrix.flowquic == 'ON'
        shell: bash
        run: bash flowquic/run-windows.sh

      - name: Logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.label || matrix.os }}
          path: |
            *.log
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeError.log
          if-no-files-found: warn

      - name: Binaries and packages
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.label || matrix.os }}
          path: |
            build/bin/fdbserver
            build/bin/fdbcli
            build/lib/libfdb_c.so
            build/lib/libfdb_c.dylib
            build/**/*.exe
            build/**/fdb_c.dll
            build/**/*.msi
            build/packages/*.pkg
            *.deb
            *.rpm

      # Unstripped, fdbserver is 441 MB against upstream's 94 MB.
      - name: Strip (linux, macos)
        if: inputs.release_tag != '' && matrix.os != 'windows'
        shell: bash
        run: |
          for f in build/bin/fdbserver build/bin/fdbcli build/lib/libfdb_c.so build/lib/libfdb_c.dylib; do
            [ -f "$f" ] || continue
            strip -S "$f" 2>/dev/null || strip --strip-unneeded "$f" 2>/dev/null || true
            ls -l "$f"
          done

      # gh ships preinstalled on the windows-latest and macos-latest runner images, but the
      # linux job runs in foundationdb/build:rockylinux9-latest, a plain container with none of
      # the runner's own tooling, so Publish's `gh release upload` failed with "command not
      # found" (run 42507818803). Rocky Linux 9 is RPM-based; this is cli.github.com's own dnf
      # repo, the same install GitHub's docs give for RHEL/Fedora/CentOS/Rocky.
      - name: gh CLI (linux container)
        if: inputs.release_tag != '' && matrix.flowquic != 'ON' && matrix.os == 'linux'
        shell: bash
        run: |
          set -eu
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh
          gh --version

      # A release is one flat namespace for every build tree.
      - name: Publish to the release
        if: inputs.release_tag != '' && matrix.flowquic != 'ON'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "${{ matrix.os }}" in
            linux)   sfx="linux.x86_64";   lib="build/lib/libfdb_c.so";    libsfx="so"  ;;
            macos)   sfx="macos.arm64";    lib="build/lib/libfdb_c.dylib"; libsfx="dylib" ;;
            windows) sfx="windows.x86_64"; lib=""                        ; libsfx=""   ;;
          esac
          mkdir -p out
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp build/bin/Release/fdbserver.exe "out/fdbserver.$sfx.exe"
            cp build/bin/Release/fdbcli.exe    "out/fdbcli.$sfx.exe"
            cp build/lib/Release/fdb_c.dll     "out/fdb_c.$sfx.dll"
          else
            cp build/bin/fdbserver "out/fdbserver.$sfx"
            cp build/bin/fdbcli    "out/fdbcli.$sfx"
            cp "$lib"              "out/libfdb_c.$sfx.$libsfx"
          fi
          for p in build/packages/*.pkg build/packages/*.msi *.deb *.rpm; do
            [ -f "$p" ] && cp "$p" out/ || true
          done
          ( cd out && sha256sum * > "SHA256SUMS.${{ matrix.os }}" )
          gh release upload "${{ inputs.release_tag }}" out/* --clobber --repo "${{ github.repository }}"

  # One SHA256SUMS over every platform's files, the name consumers such as the fdb-client action
  # read. Each build job publishes its own SHA256SUMS.<os>; this joins them once all three have.
  checksums:
    needs: build
    if: inputs.release_tag != '' && inputs.only == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Join the per-platform sums into SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download "${{ inputs.release_tag }}" --repo "${{ github.repository }}" --pattern 'SHA256SUMS.*' --dir sums
          for os in linux macos windows; do test -f "sums/SHA256SUMS.$os"; done
          cat sums/SHA256SUMS.* | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${{ inputs.release_tag }}" SHA256SUMS --clobber --repo "${{ github.repository }}"
