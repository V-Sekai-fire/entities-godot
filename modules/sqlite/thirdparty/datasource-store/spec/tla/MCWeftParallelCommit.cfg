\* Two databases, one recoverer, two attempts. The state space is the authority's, so this
\* config is the authority's model with renamed constants: a bigger model checks more of the
\* same protocol and costs minutes, not a different claim.
CONSTANTS
  DBS = {d1, d2}
  RECOVERERS = {r1}
  MAX_ATTEMPTS = 2
SPECIFICATION Spec
INVARIANTS
  TypeInvariants
  AckImpliesCommit
PROPERTIES
  TemporalTxnRecordProperties
  TemporalIntentProperties
  TemporalTSCacheProperties
  ImplicitCommitLeadsToExplicitCommit
  AckLeadsToExplicitCommit
